<!DOCTYPE html>
<html lang="en" data-theme="light">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Financial Assistant</title>
<script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js"></script>
<style>
:root {
  --bg:#f0f2ff; --panel:#fff; --text:#1a1a2e; --text-sub:#666;
  --border:#e5e7eb; --card:#f8f9fa; --input-bg:#fff;
  --msg-bot:#e5e7eb; --msg-bot-text:#333;
  --chip-bg:#f0f4ff; --chip-border:#c7d2fe; --chip-text:#4f46e5;
  --shadow:0 8px 30px rgba(0,0,0,0.1);
}
[data-theme="dark"] {
  --bg:#0f0f1a; --panel:#1a1a2e; --text:#e2e8f0; --text-sub:#94a3b8;
  --border:#2d3748; --card:#16213e; --input-bg:#16213e;
  --msg-bot:#2d3748; --msg-bot-text:#e2e8f0;
  --chip-bg:#1e293b; --chip-border:#4f46e5; --chip-text:#a5b4fc;
  --shadow:0 8px 30px rgba(0,0,0,0.4);
}
*{margin:0;padding:0;box-sizing:border-box}
body{font-family:'Segoe UI',sans-serif;background:linear-gradient(135deg,#667eea 0%,#764ba2 100%);min-height:100vh;padding:14px;color:var(--text);transition:background 0.3s}
[data-theme="dark"] body{background:linear-gradient(135deg,#0f0f1a 0%,#1a0a2e 100%)}

  <!-- Chart.js -->
  <script src="https://cdnjs.cloudflare.com/ajax/libs/Chart.js/3.9.1/chart.min.js" defer></script>

  <!-- App Styles -->
  <link rel="stylesheet" href="css/style.css" />
</head>
<body>

<!-- ═══════════════════════════════════════════════════
     APP BAR
════════════════════════════════════════════════════ -->
<header class="app-bar">
  <div class="app-title">💹 Financial Assistant</div>
  <div class="app-bar-btns">
    <button class="ab-btn" id="themeBtn" onclick="toggleTheme()">🌙 Dark Mode</button>
    <button class="ab-btn green" onclick="exportCSV()">⬇ Export CSV</button>
    <button class="ab-btn red"   onclick="clearAll()">🗑 Clear All</button>
  </div>
</header>

<!-- ═══════════════════════════════════════════════════
     MAIN LAYOUT
════════════════════════════════════════════════════ -->
<main class="container">

  <!-- ── LEFT PANEL: CHAT ──────────────────────────── -->
  <section class="panel" aria-label="Chat &amp; Stats">
    <div class="ph">
      <span>💬 Chat</span>
      <span>Type naturally · I understand you</span>
    </div>

    <!-- 9 stat cards -->
    <div class="stats-grid" role="region" aria-label="Financial overview">
      <div class="sc si">
        <div class="sc-lbl">Income</div>
        <div class="sc-val" id="sInc">$0.00</div>
        <div class="sc-sub" id="sIncC">0 entries</div>
      </div>
      <div class="sc se">
        <div class="sc-lbl">Expenses</div>
        <div class="sc-val" id="sExp">$0.00</div>
        <div class="sc-sub" id="sExpC">0 entries</div>
      </div>
      <div class="sc sb">
        <div class="sc-lbl">Balance</div>
        <div class="sc-val" id="sBal">$0.00</div>
        <div class="sc-sub" id="sBalS">—</div>
      </div>
      <div class="sc ss">
        <div class="sc-lbl">Savings Rate</div>
        <div class="sc-val" id="sSav">0%</div>
        <div class="sc-sub">of income saved</div>
      </div>
      <div class="sc sa">
        <div class="sc-lbl">Avg Expense</div>
        <div class="sc-val" id="sAvg">$0.00</div>
        <div class="sc-sub">per transaction</div>
      </div>
      <div class="sc sg">
        <div class="sc-lbl">Biggest Expense</div>
        <div class="sc-val" id="sBig">$0.00</div>
        <div class="sc-sub" id="sBigC">—</div>
      </div>
      <div class="sc sd">
        <div class="sc-lbl">Spend / Day</div>
        <div class="sc-val" id="sDay">$0.00</div>
        <div class="sc-sub">daily avg rate</div>
      </div>
      <div class="sc sr">
        <div class="sc-lbl">Runway</div>
        <div class="sc-val" id="sRun">—</div>
        <div class="sc-sub">days at current rate</div>
      </div>
      <div class="sc sc2">
        <div class="sc-lbl">Total Entries</div>
        <div class="sc-val" id="sCnt">0</div>
        <div class="sc-sub" id="sCntS">—</div>
      </div>
    </div>

    <!-- Alert banners -->
    <div class="alerts" id="alertsWrap" role="alert" aria-live="polite"></div>

    <!-- Message feed -->
    <div class="msgs" id="msgs" role="log" aria-live="polite" aria-label="Conversation"></div>

    <!-- Quick-action chips -->
    <div class="chips" role="toolbar" aria-label="Quick actions">
      <span class="chip" onclick="fi('Show me a full summary')">📊 Summary</span>
      <span class="chip" onclick="fi('What is my balance?')">💳 Balance</span>
      <span class="chip" onclick="fi('I earned $')">💰 Income</span>
      <span class="chip" onclick="fi('I spent $')">💸 Expense</span>
      <span class="chip" onclick="fi('Show top spending categories')">🏆 Top Cats</span>
      <span class="chip" onclick="fi('My opening balance is $')">🎯 Set Balance</span>
      <span class="chip" onclick="fi('Give me savings tips')">💡 Tips</span>
      <span class="chip" onclick="switchTab('budget')">📋 Budgets</span>
      <span class="chip" onclick="switchTab('insights')">🔍 Insights</span>
    </div>

    <p class="hint">💡 "Earned $2000 salary" · "Spent $45 groceries" · "Netflix $15 monthly" · "Sold phone $300"</p>

    <!-- Input -->
    <div class="input-row">
      <input
        type="text"
        id="ui"
        placeholder="Describe a transaction or ask a question…"
        aria-label="Message input"
        autocomplete="off"
      />
      <button class="send" onclick="send()" aria-label="Send message">Send ➤</button>
    </div>
  </section>

  <!-- ── RIGHT PANEL: ANALYTICS ────────────────────── -->
  <section class="panel" style="min-height:640px" aria-label="Analytics">
    <div class="ph">
      <span>📊 Analytics</span>
      <span id="periodLbl">All time</span>
    </div>

    <!-- Tab navigation -->
    <nav class="tabs" role="tablist" aria-label="Analytics tabs">
      <div class="tab active" role="tab" aria-selected="true"  onclick="switchTab('charts')">📈 Charts</div>
      <div class="tab"        role="tab" aria-selected="false" onclick="switchTab('insights')">🔍 Insights</div>
      <div class="tab"        role="tab" aria-selected="false" onclick="switchTab('budget')">🎯 Budgets</div>
      <div class="tab"        role="tab" aria-selected="false" onclick="switchTab('history')">📋 History</div>
    </nav>

    <!-- CHARTS TAB -->
    <div class="tc active" id="tab-charts" role="tabpanel">
      <div class="cgrid">
        <div class="cbox">
          <div class="ctitle">🍩 Expenses by Category <em>All time</em></div>
          <div class="cwrap"><canvas id="cCat" aria-label="Expenses by category donut chart"></canvas></div>
        </div>
        <div class="cbox">
          <div class="ctitle">📊 Income / Expenses / Balance <em>Totals</em></div>
          <div class="cwrap"><canvas id="cIE" aria-label="Income vs expenses bar chart"></canvas></div>
        </div>
        <div class="cbox span2">
          <div class="ctitle">📈 Cumulative Balance Over Time <em>Running total</em></div>
          <div class="cwrap sm"><canvas id="cTrend" aria-label="Balance trend line chart"></canvas></div>
        </div>
        <div class="cbox span2">
          <div class="ctitle">📅 Monthly Income vs Expenses <em>By month</em></div>
          <div class="cwrap sm"><canvas id="cMonthly" aria-label="Monthly grouped bar chart"></canvas></div>
        </div>
      </div>
    </div>

    <!-- INSIGHTS TAB -->
    <div class="tc" id="tab-insights" role="tabpanel">
      <div class="iscroll" id="insightsPanel">
        <div class="none">Add transactions to unlock insights.</div>
      </div>
    </div>

    <!-- BUDGET TAB -->
    <div class="tc" id="tab-budget" role="tabpanel">
      <div class="bpanel" id="budgetPanel">
        <div class="none">No expenses logged yet.</div>
      </div>
    </div>

    <!-- HISTORY TAB -->
    <div class="tc" id="tab-history" role="tabpanel">
      <div class="htool">
        <input class="sbox" type="text"  id="searchBox" placeholder="🔍 Search…" oninput="renderHistory()" aria-label="Search transactions" />
        <select class="fsel" id="fType"  onchange="renderHistory()" aria-label="Filter by type">
          <option value="all">All types</option>
          <option value="income">Income</option>
          <option value="expense">Expenses</option>
        </select>
        <select class="fsel" id="fMonth" onchange="renderHistory()" aria-label="Filter by month">
          <option value="all">All months</option>
        </select>
        <select class="fsel" id="fCat"   onchange="renderHistory()" aria-label="Filter by category">
          <option value="all">All categories</option>
        </select>
      </div>
      <div class="txlist" id="txList">
        <div class="none">No transactions yet.</div>
      </div>
    </div>
  </section>

</main>

<!-- ═══════════════════════════════════════════════════
     FOOTER
════════════════════════════════════════════════════ -->
<footer class="site-footer">
  <p>
    Developed by <strong>ZAKARIA Obazzi</strong> &nbsp;·&nbsp;
    Financial Assistant v1.0 &nbsp;·&nbsp;
    &copy; <span id="year"></span> All rights reserved.
  </p>
</footer>

<!-- App Logic -->
<script src="js/app.js"></script>
<script>
  // Inject current year dynamically
  document.getElementById('year').textContent = new Date().getFullYear();
</script>

</body>
</html>
